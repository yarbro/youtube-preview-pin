<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- A video preview card held by a pushpin. Colours match the extension's
       own UI (the blue-to-purple gradient in styles.css); the pin shape is
       the same Material Symbols glyph as the in-page Pin button. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pinfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.35"/>
    </filter>
    <filter id="pinshadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
    <path id="pin" d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/>
    <!-- Cuts a gap around the pin out of the card, so the two never touch. -->
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <use href="#pin" transform="translate(86 42) rotate(45) scale(2.7) translate(-12 -12)" fill="#000" stroke="#000" stroke-width="3.4" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#sheen)"/>

  <g filter="url(#soft)">
    <g mask="url(#cut)">
      <rect x="16" y="46" width="82" height="58" rx="13" fill="#fff"/>
      <path d="M47 62.5v25l22-12.5z" fill="#6d28d9" stroke="#6d28d9" stroke-width="6" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- The filter sits on an untransformed group so the shadow falls straight
       down instead of following the pin's rotation. -->
  <g filter="url(#pinshadow)">
    <use href="#pin" transform="translate(86 42) rotate(45) scale(2.7) translate(-12 -12)" fill="url(#pinfill)"/>
  </g>
</svg>
